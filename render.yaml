services:
  - type: web
    name: local-music-analysis-backend
    runtime: docker
    plan: starter
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    healthCheckPath: /api/health
    disk:
      name: music-analysis-data
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: CORS_ORIGINS
        value: https://your-netlify-site.netlify.app
      - key: MUSIC_FAST_UPLOAD
        value: "1"
      - key: MUSIC_ENABLE_DEMUCS
        value: "0"
      - key: MUSIC_MAX_UPLOAD_MB
        value: "40"
      - key: MUSIC_MAX_DURATION_SECONDS
        value: "300"
      - key: MUSIC_MAX_PENDING_JOBS
        value: "2"
